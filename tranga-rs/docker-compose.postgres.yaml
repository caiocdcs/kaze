services:
  tranga:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tranga-api
    ports:
      - "6531:6531"
    volumes:
      - manga-data:/Manga
      - tranga-state:/usr/share/tranga-api
    environment:
      - PORT=6531
      - DATABASE_URL=postgres://tranga:tranga@postgres:5432/tranga
      - DOWNLOAD_LOCATION=/Manga
      - FLARESOLVERR_URL=http://flaresolverr:8191
    depends_on:
      postgres:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: tranga-postgres
    environment:
      - POSTGRES_USER=tranga
      - POSTGRES_PASSWORD=tranga
      - POSTGRES_DB=tranga
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tranga"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

volumes:
  manga-data:
  tranga-state:
  pg-data:
