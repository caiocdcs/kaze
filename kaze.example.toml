# kaze configuration. Every key is optional; shown values are the defaults.
# Keys can also come from the environment: KAZE_LISTEN, KAZE_LIBRARY_DIR,
# KAZE_SETTINGS__CONCURRENCY (nested keys use a double underscore), ...

# --- Boot settings (read at startup) --------------------------------------

listen = "0.0.0.0:6531"

# Database and other state.
data_dir = "data"

# Library root (point Komga/Kavita here). Each series gets a folder.
library_dir = "library"

[http]
timeout_secs = 30
# user_agent = "..."

# --- Settings -------------------------------------------------------------
# These can all be changed in the UI (Settings). Anything set here instead
# wins and shows as locked in the UI, which keeps declarative setups
# (NixOS, compose files) the source of truth.

[settings]
# naming_template = "%M - ?V(Vol.%V )Ch.%C?T( - %T)"  # %M series, %V volume, %C chapter, %T title, %A author, %Y year
# api_key = "change-me-please"   # require X-Api-Key / ?apikey= on the API
# concurrency = 4                # jobs at once
# per_source = 2                 # jobs at once against one site
# page_concurrency = 4           # pages of one chapter fetched at once
# sync_latest_minutes = 15       # poll each site's latest updates
# refresh_hours = 24             # full chapter list refresh per series
# flaresolverr_url = "http://flaresolverr:8191"  # get past Cloudflare challenges
# paused_sources = ["asura"]    # jobs of these sites wait until resumed
