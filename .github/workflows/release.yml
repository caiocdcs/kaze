name: Release

# Push a tag like v0.1.0 to publish ghcr.io/<owner>/kaze:{0.1.0,0.1,latest}
# for amd64 and arm64, and a GitHub release listing the feat/fix/perf commits.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kaze

jobs:
  image:
    name: Image (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          # Native runners: compiling Rust under QEMU takes hours.
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Tag image and release
    needs: image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine platforms under the version tags
        working-directory: /tmp/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          docker buildx imagetools create \
            -t "$IMAGE:$version" -t "$IMAGE:$minor" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and tags, to find the previous release.
          fetch-depth: 0
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # We push to main without pull requests, so the generated notes are
        # only a compare link. Above it go the hand-written highlights, if
        # .github/release-notes/<tag>.md exists, then the user-facing
        # commits grouped by type.
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
          subjects=$(git log --reverse --format='%s' "$previous..$GITHUB_REF_NAME")
          {
            highlights=".github/release-notes/$GITHUB_REF_NAME.md"
            if [ -f "$highlights" ]; then cat "$highlights"; echo; fi
            for section in "feat:Features" "fix:Fixes" "perf:Performance"; do
              lines=$(printf '%s\n' "$subjects" | grep -E "^${section%%:*}(\(|!|:)" | sed 's/^/- /')
              if [ -n "$lines" ]; then printf '### %s\n\n%s\n\n' "${section#*:}" "$lines"; fi
            done
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
