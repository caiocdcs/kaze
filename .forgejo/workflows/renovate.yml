name: renovate
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: alpine
    container:
      image: renovate/renovate:44.255.1@sha256:183a671d000c8f20f9dac8c3b1100677c1edb79a0b46bcf8798f1490c785d27c
    steps:
      - name: renovate
        shell: sh
        env:
          RENOVATE_TOKEN: ${{ secrets.BOT_TOKEN }}
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: https://forge.int.cdcs.dev
          # Signs Renovate commits: the raw SSH private key (with newlines) registered on the bot's
          # Forgejo account. Renovate treats base64-encoded keys as GPG, so keep it plaintext.
          RENOVATE_GIT_PRIVATE_KEY: ${{ secrets.CI_SIGNING_KEY }}
          LOG_LEVEL: debug
        run: renovate caiocdcs/kaze
