[advisories]
ignore = [
    # SQLite bundled in libsqlite3-sys < 0.39 can return stale memory when it
    # opens a database with a crafted sibling `-wal` file. kaze only opens its
    # own database and backups, and restores are single uploaded files behind
    # the API key. sqlx 0.9.0 caps libsqlite3-sys at < 0.38: drop this once a
    # sqlx release allows 0.39.
    "RUSTSEC-2026-0459",
]
