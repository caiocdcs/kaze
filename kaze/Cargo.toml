[package]
name = "kaze"
version = "0.1.0"
edition = "2024"
description = "Manga download manager"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "rustls-tls"] }
scraper = "0.22"
image = "0.25"
async_zip = { version = "0.0.17", features = ["deflate", "tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
governor = "0.8"
chrono = { version = "0.4", features = ["serde"] }
strsim = "0.11"
url = "2"
thiserror = "2"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tower = "0.5"
utoipa = { version = "5", features = ["axum_extras", "chrono", "ulid"] }
utoipa-swagger-ui = { version = "8", features = ["axum", "vendored"] }
ulid = { version = "1", features = ["serde", "uuid"] }
rand = "0.9"
md-5 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
derive_more = { version = "2", features = ["display", "from", "into"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
anyhow = "1"
openssl = { version = "0.10", features = ["vendored"] }
bytes = "1"
regex = "1"
urlencoding = "2"
headless_chrome = { version = "1", optional = true }

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"

[features]
default = []
chromium = ["headless_chrome"]

# headless_chrome and auto_generate_cdp are extremely large crates that OOM the
# compiler in memory-constrained Docker builds (< ~6 GB RAM).
# These settings drastically reduce compile-time memory usage:
# - opt-level = "z": minimal optimizations, lowest memory
# - codegen-units = 16: split into small LLVM modules processed sequentially
[profile.release.package.headless_chrome]
opt-level = "z"
codegen-units = 16

[profile.release.package.auto_generate_cdp]
opt-level = "z"
codegen-units = 16
