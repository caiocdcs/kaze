# kaze with the services it can work with. Copy to compose.yml, drop what
# you don't need, then `docker compose up -d` and open http://localhost:6531.
#
# In kaze → Settings:
#   General → FlareSolverr URL: http://flaresolverr:8191
#   Connect → Komga: URL http://komga:25600 and an API key from Komga
#     (in Komga, add /data as a library)
#   Connect → Apprise: URL http://apprise:8000 and URLs like ntfy://ntfy.sh/topic

services:
  kaze:
    image: ghcr.io/caiocdcs/kaze:latest
    build: .
    ports:
      - "6531:6531"
    volumes:
      - ./data:/data
      # Komga reads the same folder.
      - ./library:/library
    environment:
      # Anything in kaze.example.toml works as KAZE_*; these lock the setting.
      # KAZE_SETTINGS__FLARESOLVERR_URL: http://flaresolverr:8191
      # Logs: kaze=debug also shows every API read and refresh;
      # KAZE_LOG_FORMAT=json for a log collector.
      KAZE_LOG: kaze=info
    user: "1000:1000"
    restart: unless-stopped

  # Optional: for sites behind Cloudflare challenges.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped

  # Optional: reads the folder kaze writes to; kaze only triggers scans.
  komga:
    image: gotson/komga:latest
    ports:
      - "25600:25600"
    volumes:
      - ./komga:/config
      - ./library:/data:ro
    user: "1000:1000"
    restart: unless-stopped

  # Or Kavita, the same way (add /manga as a library in Kavita).
  # kavita:
  #   image: jvmilazz0/kavita:latest
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - ./kavita:/kavita/config
  #     - ./library:/manga:ro
  #   restart: unless-stopped

  # Optional: notifications to 100+ services.
  apprise:
    image: caronc/apprise:latest
    restart: unless-stopped
