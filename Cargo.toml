[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/caiocdcs/kaze"

[workspace.dependencies]
# internal
kaze-core = { path = "crates/kaze-core" }
kaze-sources = { path = "crates/kaze-sources" }

# shared third-party (added milestone by milestone)
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
backon = { version = "1", default-features = false }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["env", "toml"] }
futures-util = "0.3"
# Free disk space for the health check.
fs4 = "1"
http = "1"
http-body-util = "0.1"
regex = "1"
scraper = "0.27"
# Fuzzy title matching for library import.
strsim = "0.11"
governor = "0.10"
# Webhook body templates.
minijinja = { version = "2", features = ["json"] }
# Email notifications, on the same rustls + aws-lc-rs stack as reqwest.
lettre = { version = "0.11", default-features = false, features = ["aws-lc-rs", "builder", "hostname", "rustls-platform-verifier", "smtp-transport", "tokio1-rustls"] }
reqwest = { version = "0.13", features = ["brotli", "cookies", "gzip", "json", "query"] }
# The built web UI, compiled into the binary.
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "trace"] }
tracing = "0.1"
# TypeScript types for the web UI, exported by `cargo test`.
ts-rs = { version = "12", features = ["chrono-impl", "no-serde-warnings", "serde-json-impl", "url-impl"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"
url = { version = "2", features = ["serde"] }
wiremock = "0.6"
# We write store-only CBZs (pages are already compressed), but importing
# reads other tools' files, which are usually deflated.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# pedantic lints that are more noise than signal for an app
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow" # flags proper names like WeebCentral
# Production code returns errors; tests may panic (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.metadata.crane]
name = "kaze"
