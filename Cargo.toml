[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/caiocdcs/kaze"

[workspace.dependencies]
# internal
kaze-core = { path = "crates/kaze-core" }
kaze-sources = { path = "crates/kaze-sources" }

# shared third-party (added milestone by milestone)
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# pedantic lints that are more noise than signal for an app
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.metadata.crane]
name = "kaze"
