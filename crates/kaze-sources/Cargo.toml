[package]
name = "kaze-sources"
description = "Site implementations of the kaze Source trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["weebcentral"]
# Each site is a feature; HTML scrapers pull in the parsing crates.
weebcentral = ["scraping"]
scraping = ["dep:regex", "dep:scraper"]

[dependencies]
kaze-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
backon.workspace = true
governor.workspace = true
regex = { workspace = true, optional = true }
reqwest.workspace = true
scraper = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
wiremock.workspace = true

[lints]
workspace = true
